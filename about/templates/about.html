
{% extends "base.html" %}
{% load static %}

{% block content %}

<div class="container mt-5">
    <div class="row">
        <div class="col-md-8">
            <h1>{{ about.title }}</h1>

            <div class="card-body">
                {{ about.content | linebreaks }}
            </div>

            <p class="text-muted">
                Last updated: {{ about.updated_on }}
            </p>
        </div>

        <div class="col-md-4">
            <img
                src="{% static 'images/default.jpg' %}"
                class="img-fluid"
                alt="About Me"
            >
        </div>
    </div>
</div>

{% endblock content %}
